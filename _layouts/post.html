---
layout: default
body_class: post-page
---
<article class="post">
  <header class="post-hero">
    <a class="post-series" href="{{ '/blog/' | relative_url }}">{{ page.series | default: '博客' }}</a>
    <h1>{{ page.title }}</h1>
    <div class="post-byline">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time>
      {% if page.tags %}
      <ul class="tag-list" aria-label="博客标签">
        {% for tag in page.tags %}
        <li>{{ tag }}</li>
        {% endfor %}
      </ul>
      {% endif %}
    </div>
  </header>

  <div class="post-layout">
    <aside class="post-toc" aria-label="本文目录">
      <details open>
        <summary>本文目录</summary>
        <nav id="post-toc-links"></nav>
      </details>
    </aside>

    <div id="post-content" class="post-content tex2jax_process">
      {{ content }}
    </div>
  </div>
</article>

<script>
  (function () {
    var content = document.getElementById('post-content');
    var toc = document.getElementById('post-toc-links');
    if (!content || !toc) return;

    var headings = content.querySelectorAll('h2');
    if (!headings.length) {
      var aside = toc.closest('.post-toc');
      if (aside) aside.hidden = true;
      return;
    }

    headings.forEach(function (heading, index) {
      if (!heading.id) heading.id = 'section-' + (index + 1);
      var link = document.createElement('a');
      link.href = '#' + heading.id;
      link.textContent = heading.textContent;
      toc.appendChild(link);
    });
  }());
</script>
